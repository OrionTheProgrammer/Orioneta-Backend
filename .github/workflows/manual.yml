name: Manual install Orioneta from DockerHub

on:
  workflow_dispatch:
    inputs:
      deploy_mode:
        description: "Servicios a instalar en la EC2"
        required: true
        default: "mvp"
        type: choice
        options:
          - mvp
          - full

      image_tag:
        description: "Tag de las imágenes en DockerHub"
        required: true
        default: "latest"
        type: string

      force_recreate:
        description: "Recrear contenedores aunque ya existan"
        required: true
        default: true
        type: boolean

      prune_images:
        description: "Limpiar imágenes Docker antiguas al finalizar"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

env:
  MVP_SERVICES: >-
    postgres
    rabbitmq
    redis
    minio
    auth-service
    user-service
    friendship-service
    conversation-service
    message-service
    realtime-service
    media-service
    bff-service
    gateway-service

  FULL_SERVICES: >-
    postgres
    rabbitmq
    redis
    minio
    auth-service
    user-service
    friendship-service
    bff-service
    gateway-service
    conversation-service
    message-service
    realtime-service
    notification-service
    customization-service
    media-service
    neta-market-service
    moderation-service
    audit-service

jobs:
  install-from-dockerhub:
    name: Install Orioneta stack on EC2
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Resolve services
        id: services
        run: |
          set -euo pipefail

          if [ "${{ github.event.inputs.deploy_mode }}" = "full" ]; then
            services="${FULL_SERVICES}"
          else
            services="${MVP_SERVICES}"
          fi

          echo "services=${services}" >> "$GITHUB_OUTPUT"
          echo "Services selected:"
          echo "${services}"

      - name: Configure SSH
        run: |
          set -euo pipefail

          install -m 700 -d "$HOME/.ssh"

          printf '%s\n' "${{ secrets.EC2_SSH_KEY }}" > "$HOME/.ssh/orioneta-ec2"
          chmod 600 "$HOME/.ssh/orioneta-ec2"

          echo "Testing SSH TCP connection..."

          for attempt in 1 2 3 4 5 6; do
            echo "Attempt ${attempt}/6"

            if timeout 20 bash -c "</dev/tcp/${{ secrets.EC2_HOST }}/${{ secrets.EC2_PORT }}"; then
              echo "EC2 SSH port is reachable"
              break
            fi

            if [ "$attempt" -eq 6 ]; then
              echo "::error::Could not connect to EC2. Check EC2_HOST, EC2_PORT and Security Group inbound SSH rule."
              exit 1
            fi

            sleep $((attempt * 10))
          done

          ssh-keyscan -T 20 -p "${{ secrets.EC2_PORT }}" "${{ secrets.EC2_HOST }}" >> "$HOME/.ssh/known_hosts"

      - name: Prepare EC2 host
        run: |
          set -euo pipefail

          remote="${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}"
          port="${{ secrets.EC2_PORT }}"
          key="$HOME/.ssh/orioneta-ec2"

          ssh -i "$key" -p "$port" \
            -o BatchMode=yes \
            -o ConnectTimeout=20 \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=10 \
            "$remote" bash -s <<'REMOTE'
          set -euo pipefail

          echo "=================================================="
          echo "Preparing EC2 host"
          echo "=================================================="

          if [ -f /etc/os-release ]; then
            . /etc/os-release
            echo "Remote OS: ${PRETTY_NAME:-unknown}"
          fi

          install_packages() {
            if command -v dnf >/dev/null 2>&1; then
              sudo -n dnf install -y "$@" --allowerasing
            elif command -v yum >/dev/null 2>&1; then
              sudo -n yum install -y "$@"
            elif command -v apt >/dev/null 2>&1; then
              sudo -n apt update -y
              sudo -n apt install -y "$@"
            else
              echo "No supported package manager found."
              exit 1
            fi
          }

          if ! command -v docker >/dev/null 2>&1; then
            echo "Installing Docker..."

            if command -v dnf >/dev/null 2>&1; then
              sudo -n dnf clean all || true
              sudo -n dnf makecache --refresh || true

              # Amazon Linux 2023 trae curl-minimal.
              # No instalamos curl completo para evitar conflicto.
              install_packages docker git openssl ca-certificates
            elif command -v apt >/dev/null 2>&1; then
              install_packages docker.io git curl openssl ca-certificates
            else
              install_packages docker git curl openssl ca-certificates
            fi
          else
            echo "Docker is already installed"
          fi

          sudo -n systemctl enable docker
          sudo -n systemctl start docker

          if ! docker info >/dev/null 2>&1 && sudo -n docker info >/dev/null 2>&1; then
            echo "Docker works with sudo"
          elif docker info >/dev/null 2>&1; then
            echo "Docker works without sudo"
          else
            echo "::error::Docker is installed but not usable"
            exit 1
          fi

          echo "Checking Docker Compose plugin..."

          if ! docker compose version >/dev/null 2>&1 && ! sudo -n docker compose version >/dev/null 2>&1; then
            echo "Installing Docker Compose manually..."

            arch="$(uname -m)"

            case "$arch" in
              x86_64)
                compose_arch="x86_64"
                ;;
              aarch64|arm64)
                compose_arch="aarch64"
                ;;
              *)
                echo "Unsupported architecture: ${arch}"
                exit 1
                ;;
            esac

            compose_url="https://github.com/docker/compose/releases/download/v2.32.4/docker-compose-linux-${compose_arch}"

            sudo -n mkdir -p /usr/local/lib/docker/cli-plugins
            sudo -n mkdir -p /usr/libexec/docker/cli-plugins
            sudo -n mkdir -p /usr/lib/docker/cli-plugins
            mkdir -p "$HOME/.docker/cli-plugins"

            curl -fsSL --retry 5 --retry-delay 5 "$compose_url" -o /tmp/docker-compose

            sudo -n cp /tmp/docker-compose /usr/local/lib/docker/cli-plugins/docker-compose
            sudo -n cp /tmp/docker-compose /usr/libexec/docker/cli-plugins/docker-compose
            sudo -n cp /tmp/docker-compose /usr/lib/docker/cli-plugins/docker-compose
            cp /tmp/docker-compose "$HOME/.docker/cli-plugins/docker-compose"

            sudo -n chmod +x /usr/local/lib/docker/cli-plugins/docker-compose
            sudo -n chmod +x /usr/libexec/docker/cli-plugins/docker-compose
            sudo -n chmod +x /usr/lib/docker/cli-plugins/docker-compose
            chmod +x "$HOME/.docker/cli-plugins/docker-compose"

            sudo -n systemctl restart docker || true
          fi

          if docker info >/dev/null 2>&1; then
            docker_cmd=(docker)
          elif sudo -n docker info >/dev/null 2>&1; then
            docker_cmd=(sudo -n docker)
          else
            echo "::error::Docker is not available for current user"
            exit 1
          fi

          echo "Docker version:"
          "${docker_cmd[@]}" --version

          echo "Docker Compose version:"
          "${docker_cmd[@]}" compose version

          if [ ! -f /swapfile ]; then
            echo "Creating 4GB swapfile..."
            sudo -n fallocate -l 4G /swapfile
            sudo -n chmod 600 /swapfile
            sudo -n mkswap /swapfile
            sudo -n swapon /swapfile
            echo '/swapfile none swap sw 0 0' | sudo -n tee -a /etc/fstab
          else
            echo "Swapfile already exists"
          fi

          mkdir -p "$HOME/orioneta-backend/docker/postgres/init"
          mkdir -p "$HOME/orioneta-backend/docker/prometheus"

          echo "Memory:"
          free -h || true

          echo "Disk:"
          df -h || true

          echo "EC2 host ready"
          REMOTE

      - name: Upload deployment files
        run: |
          set -euo pipefail

          remote="${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}"
          port="${{ secrets.EC2_PORT }}"
          key="$HOME/.ssh/orioneta-ec2"

          ssh -i "$key" -p "$port" -o BatchMode=yes -o ConnectTimeout=20 "$remote" \
            "mkdir -p ~/orioneta-backend/docker/postgres/init ~/orioneta-backend/docker/prometheus"

          scp -i "$key" -P "$port" -o BatchMode=yes -o ConnectTimeout=20 \
            docker-compose.prod.yml \
            "$remote:~/orioneta-backend/docker-compose.prod.yml"

          if [ -f docker/postgres/init/01-create-databases.sql ]; then
            scp -i "$key" -P "$port" -o BatchMode=yes -o ConnectTimeout=20 \
              docker/postgres/init/01-create-databases.sql \
              "$remote:~/orioneta-backend/docker/postgres/init/01-create-databases.sql"
          fi

          if [ -f docker/prometheus/prometheus.prod.yml ]; then
            scp -i "$key" -P "$port" -o BatchMode=yes -o ConnectTimeout=20 \
              docker/prometheus/prometheus.prod.yml \
              "$remote:~/orioneta-backend/docker/prometheus/prometheus.prod.yml"
          fi

      - name: Prepare remote environment
        run: |
          set -euo pipefail

          remote="${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}"
          port="${{ secrets.EC2_PORT }}"
          key="$HOME/.ssh/orioneta-ec2"

          ssh -i "$key" -p "$port" \
            -o BatchMode=yes \
            -o ConnectTimeout=20 \
            "$remote" \
            "DOCKERHUB_USERNAME='${{ secrets.DOCKERHUB_USERNAME }}' IMAGE_TAG='${{ github.event.inputs.image_tag }}' bash -s" <<'REMOTE'
          set -euo pipefail

          cd "$HOME/orioneta-backend"

          if [ ! -f .env ]; then
            echo "Creating .env file"

            jwt_secret="$(openssl rand -base64 48)"

            cat > .env <<EOF
          DOCKERHUB_USERNAME=${DOCKERHUB_USERNAME}
          IMAGE_TAG=${IMAGE_TAG}

          POSTGRES_USER=orioneta
          POSTGRES_PASSWORD=orioneta

          RABBITMQ_DEFAULT_USER=orioneta
          RABBITMQ_DEFAULT_PASS=orioneta

          COMPOSE_PROFILES=
          JAVA_TOOL_OPTIONS=-Xms64m -Xmx256m -XX:+UseSerialGC

          ORIONETA_JWT_ISSUER=orioneta-auth-service
          ORIONETA_JWT_SECRET=${jwt_secret}

          SPRING_PROFILES_ACTIVE=prod
          EOF
          else
            echo "Updating existing .env file"

            if grep -q '^DOCKERHUB_USERNAME=' .env; then
              sed -i "s#^DOCKERHUB_USERNAME=.*#DOCKERHUB_USERNAME=${DOCKERHUB_USERNAME}#" .env
            else
              printf '\nDOCKERHUB_USERNAME=%s\n' "$DOCKERHUB_USERNAME" >> .env
            fi

            if grep -q '^IMAGE_TAG=' .env; then
              sed -i "s#^IMAGE_TAG=.*#IMAGE_TAG=${IMAGE_TAG}#" .env
            else
              printf 'IMAGE_TAG=%s\n' "$IMAGE_TAG" >> .env
            fi
          fi

          echo "Remote environment ready"
          echo "IMAGE_TAG=${IMAGE_TAG}"
          REMOTE

      - name: Pull images and start stack
        run: |
          set -euo pipefail

          remote="${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}"
          port="${{ secrets.EC2_PORT }}"
          key="$HOME/.ssh/orioneta-ec2"

          ssh -i "$key" -p "$port" \
            -o BatchMode=yes \
            -o ConnectTimeout=20 \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=10 \
            "$remote" \
            "DOCKERHUB_USERNAME='${{ secrets.DOCKERHUB_USERNAME }}' DOCKERHUB_TOKEN='${{ secrets.DOCKERHUB_TOKEN }}' SERVICES='${{ steps.services.outputs.services }}' FORCE_RECREATE='${{ github.event.inputs.force_recreate }}' PRUNE_IMAGES='${{ github.event.inputs.prune_images }}' bash -s" <<'REMOTE'
          set -euo pipefail

          echo "=================================================="
          echo "Installing Orioneta from DockerHub"
          echo "=================================================="

          cd "$HOME/orioneta-backend"

          if docker info >/dev/null 2>&1; then
            docker_cmd=(docker)
          elif sudo -n docker info >/dev/null 2>&1; then
            docker_cmd=(sudo -n docker)
          else
            echo "::error::Docker is not available"
            exit 1
          fi

          export COMPOSE_PARALLEL_LIMIT=1
          export COMPOSE_PROFILES=media,realtime
          export DOCKER_CLIENT_TIMEOUT=600
          export COMPOSE_HTTP_TIMEOUT=600

          echo "Services to install:"
          echo "$SERVICES"

          echo "DockerHub login..."
          printf '%s\n' "$DOCKERHUB_TOKEN" | "${docker_cmd[@]}" login docker.io -u "$DOCKERHUB_USERNAME" --password-stdin

          echo "Validating compose file..."
          "${docker_cmd[@]}" compose -f docker-compose.prod.yml config >/dev/null

          retry_pull() {
            service="$1"

            for attempt in 1 2 3 4 5; do
              echo "Pulling ${service}. Attempt ${attempt}/5"

              if "${docker_cmd[@]}" compose -f docker-compose.prod.yml pull "$service"; then
                echo "Pull OK: ${service}"
                return 0
              fi

              if [ "$attempt" -eq 5 ]; then
                echo "::error::Pull failed for ${service}"
                return 1
              fi

              sleep $((attempt * 25))
            done
          }

          echo "Pulling selected services..."
          for service in $SERVICES; do
            retry_pull "$service"
          done

          if [ "$FORCE_RECREATE" = "true" ]; then
            echo "Starting stack with force recreate..."
            "${docker_cmd[@]}" compose -f docker-compose.prod.yml up -d --force-recreate --remove-orphans $SERVICES
          else
            echo "Starting stack..."
            "${docker_cmd[@]}" compose -f docker-compose.prod.yml up -d --remove-orphans $SERVICES
          fi

          if [ "$PRUNE_IMAGES" = "true" ]; then
            echo "Cleaning unused Docker images..."
            "${docker_cmd[@]}" image prune -f || true
          fi

          echo "Final Docker Compose status:"
          "${docker_cmd[@]}" compose -f docker-compose.prod.yml ps

          echo "Gateway health check:"
          curl -f http://localhost:8080/actuator/health || true

          echo "=================================================="
          echo "Manual installation finished"
          echo "=================================================="
          REMOTE

      - name: Print URLs
        run: |
          echo "EC2 Gateway URL: http://${{ secrets.EC2_HOST }}:8080"
          echo "EC2 Swagger URL: http://${{ secrets.EC2_HOST }}:8080/swagger-ui/index.html"
