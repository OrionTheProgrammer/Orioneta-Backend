name: Build and publish Docker images

on:
  push:
    branches:
      - main
      - develop
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dockerhub-images-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_PREFIX: orioneta
  JAVA_VERSION: "25"
  SERVICES: >-
    gateway-service
    bff-service
    auth-service
    user-service
    friendship-service
    conversation-service
    message-service
    realtime-service
    notification-service
    customization-service
    media-service
    neta-market-service
    moderation-service
    audit-service

jobs:
  build-and-publish:
    name: Build and publish service images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Validate and package Maven reactor
        run: mvn -B clean verify

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push images
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          set -euo pipefail

          short_sha="${GITHUB_SHA::12}"
          safe_ref="$(printf '%s' "$GITHUB_REF_NAME" \
            | tr '[:upper:]' '[:lower:]' \
            | sed -E 's#[^a-z0-9_.-]+#-#g' \
            | sed -E 's#^-+|-+$##g')"

          for service in $SERVICES; do
            image="${DOCKERHUB_USERNAME}/${IMAGE_PREFIX}-${service}"
            tags=(-t "${image}:sha-${short_sha}")

            if [ "$GITHUB_REF_TYPE" = "branch" ] && [ -n "$safe_ref" ]; then
              tags+=(-t "${image}:${safe_ref}")
            fi

            if [ "$GITHUB_REF_TYPE" = "tag" ] && [ -n "$safe_ref" ]; then
              tags+=(-t "${image}:${safe_ref}")
            fi

            if [ "$GITHUB_REF_NAME" = "main" ]; then
              tags+=(-t "${image}:latest")
            fi

            echo "Building ${image}"
            docker buildx build \
              --platform linux/amd64 \
              --push \
              "${tags[@]}" \
              "./${service}"
          done

  deploy-to-ec2:
    name: Deploy images to EC2
    runs-on: ubuntu-latest
    needs: build-and-publish
    if: ${{ github.ref_type == 'branch' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve deployment image tag
        id: deploy
        run: |
          safe_tag="$(printf '%s' "$GITHUB_REF_NAME" \
            | tr '[:upper:]' '[:lower:]' \
            | sed -E 's#[^a-z0-9_.-]+#-#g' \
            | sed -E 's#^-+|-+$##g')"

          echo "image_tag=${safe_tag}" >> "$GITHUB_OUTPUT"

      - name: Configure SSH
        run: |
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "${{ secrets.EC2_SSH_KEY }}" > "$HOME/.ssh/orioneta-ec2"
          chmod 600 "$HOME/.ssh/orioneta-ec2"

          if ! timeout 20 bash -c "</dev/tcp/${{ secrets.EC2_HOST }}/${{ secrets.EC2_PORT }}"; then
            echo "::error::No se pudo abrir una conexion TCP hacia EC2. Revisa EC2_HOST, EC2_PORT y el Security Group inbound para SSH."
            exit 1
          fi

          ssh-keyscan -T 20 -p "${{ secrets.EC2_PORT }}" "${{ secrets.EC2_HOST }}" >> "$HOME/.ssh/known_hosts"

      - name: Upload deployment files
        run: |
          remote="${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}"
          port="${{ secrets.EC2_PORT }}"
          key="$HOME/.ssh/orioneta-ec2"

          ssh -i "$key" -p "$port" -o BatchMode=yes -o ConnectTimeout=20 "$remote" \
            "mkdir -p ~/orioneta-backend/docker/postgres/init ~/orioneta-backend/docker/prometheus"

          scp -i "$key" -P "$port" -o BatchMode=yes -o ConnectTimeout=20 docker-compose.prod.yml "$remote:~/orioneta-backend/docker-compose.prod.yml"
          scp -i "$key" -P "$port" -o BatchMode=yes -o ConnectTimeout=20 docker/postgres/init/01-create-databases.sql "$remote:~/orioneta-backend/docker/postgres/init/01-create-databases.sql"
          scp -i "$key" -P "$port" -o BatchMode=yes -o ConnectTimeout=20 docker/prometheus/prometheus.prod.yml "$remote:~/orioneta-backend/docker/prometheus/prometheus.prod.yml"

      - name: Prepare remote environment
        run: |
          remote="${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}"
          port="${{ secrets.EC2_PORT }}"
          key="$HOME/.ssh/orioneta-ec2"
          dockerhub_username="${{ secrets.DOCKERHUB_USERNAME }}"
          image_tag="${{ steps.deploy.outputs.image_tag }}"

          ssh -i "$key" -p "$port" -o BatchMode=yes -o ConnectTimeout=20 "$remote" \
            "DOCKERHUB_USERNAME='$dockerhub_username' IMAGE_TAG='$image_tag' bash -s" <<'REMOTE'
          set -euo pipefail

          cd ~/orioneta-backend

          if [ ! -f .env ]; then
            jwt_secret="$(openssl rand -base64 48)"
            grafana_password="$(openssl rand -base64 18)"

            cat > .env <<EOF
          POSTGRES_USER=orioneta
          POSTGRES_PASSWORD=orioneta
          RABBITMQ_DEFAULT_USER=orioneta
          RABBITMQ_DEFAULT_PASS=orioneta
          GRAFANA_ADMIN_USER=orioneta
          GRAFANA_ADMIN_PASSWORD=${grafana_password}
          ORIONETA_JWT_ISSUER=orioneta-auth-service
          ORIONETA_JWT_SECRET=${jwt_secret}
          ORIONETA_OAUTH2_SUCCESS_REDIRECT_URI=http://localhost:5173/auth/oauth2/callback
          ORIONETA_OAUTH2_FAILURE_REDIRECT_URI=http://localhost:5173/auth/oauth2/error
          GOOGLE_CLIENT_ID=dev-google-client-id
          GOOGLE_CLIENT_SECRET=dev-google-client-secret
          GITHUB_CLIENT_ID=dev-github-client-id
          GITHUB_CLIENT_SECRET=dev-github-client-secret
          EOF
          fi

          if grep -q '^DOCKERHUB_USERNAME=' .env; then
            sed -i "s#^DOCKERHUB_USERNAME=.*#DOCKERHUB_USERNAME=${DOCKERHUB_USERNAME}#" .env
          else
            printf '\nDOCKERHUB_USERNAME=%s\n' "$DOCKERHUB_USERNAME" >> .env
          fi

          if grep -q '^IMAGE_TAG=' .env; then
            sed -i "s#^IMAGE_TAG=.*#IMAGE_TAG=${IMAGE_TAG}#" .env
          else
            printf 'IMAGE_TAG=%s\n' "$IMAGE_TAG" >> .env
          fi
          REMOTE

      - name: Deploy stack
        run: |
          remote="${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}"
          port="${{ secrets.EC2_PORT }}"
          key="$HOME/.ssh/orioneta-ec2"

          printf '%s' "${{ secrets.DOCKERHUB_TOKEN }}" | ssh -i "$key" -p "$port" -o BatchMode=yes -o ConnectTimeout=20 "$remote" \
            "docker login -u '${{ secrets.DOCKERHUB_USERNAME }}' --password-stdin"

          ssh -i "$key" -p "$port" -o BatchMode=yes -o ConnectTimeout=20 "$remote" <<'REMOTE'
          set -euo pipefail

          cd ~/orioneta-backend
          docker compose -f docker-compose.prod.yml pull
          docker compose -f docker-compose.prod.yml up -d --remove-orphans
          docker image prune -f
          docker compose -f docker-compose.prod.yml ps
          REMOTE

      - name: Print service URL
        run: |
          echo "Gateway URL: http://${{ secrets.EC2_HOST }}:8080"
