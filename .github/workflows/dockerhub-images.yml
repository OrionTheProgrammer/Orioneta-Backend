name: Build and publish Docker images

on:
  push:
    branches:
      - main
      - develop
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dockerhub-images-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_PREFIX: orioneta
  JAVA_VERSION: "25"
  SERVICES: >-
    gateway-service
    bff-service
    auth-service
    user-service
    friendship-service
    conversation-service
    message-service
    realtime-service
    notification-service
    customization-service
    media-service
    neta-market-service
    moderation-service
    audit-service

jobs:
  build-and-publish:
    name: Build and publish service images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Validate and package Maven reactor
        run: mvn -B clean verify

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push images
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          set -euo pipefail

          short_sha="${GITHUB_SHA::12}"
          safe_ref="$(printf '%s' "$GITHUB_REF_NAME" \
            | tr '[:upper:]' '[:lower:]' \
            | sed -E 's#[^a-z0-9_.-]+#-#g' \
            | sed -E 's#^-+|-+$##g')"

          for service in $SERVICES; do
            image="${DOCKERHUB_USERNAME}/${IMAGE_PREFIX}-${service}"
            tags=(-t "${image}:sha-${short_sha}")

            if [ "$GITHUB_REF_TYPE" = "branch" ] && [ -n "$safe_ref" ]; then
              tags+=(-t "${image}:${safe_ref}")
            fi

            if [ "$GITHUB_REF_TYPE" = "tag" ] && [ -n "$safe_ref" ]; then
              tags+=(-t "${image}:${safe_ref}")
            fi

            if [ "$GITHUB_REF_NAME" = "main" ]; then
              tags+=(-t "${image}:latest")
            fi

            echo "Building ${image}"
            docker buildx build \
              --platform linux/amd64 \
              --push \
              "${tags[@]}" \
              "./${service}"
          done
