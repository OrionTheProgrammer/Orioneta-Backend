name: Build, publish and deploy Orioneta

on:
  push:
    branches:
      - main
      - develop
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: orioneta-deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_PREFIX: orioneta
  JAVA_VERSION: "21"

  SERVICES: >-
    gateway-service
    bff-service
    auth-service
    user-service
    friendship-service
    conversation-service
    message-service
    realtime-service
    notification-service
    customization-service
    media-service
    neta-market-service
    moderation-service
    audit-service

  MVP_SERVICES: >-
    gateway-service
    auth-service
    user-service
    friendship-service

jobs:
  detect-changes:
    name: Detect changed services
    runs-on: ubuntu-latest

    outputs:
      changed_services: ${{ steps.detect.outputs.changed_services }}
      has_service_changes: ${{ steps.detect.outputs.has_service_changes }}
      deploy_files_changed: ${{ steps.detect.outputs.deploy_files_changed }}
      should_deploy: ${{ steps.detect.outputs.should_deploy }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed files and services
        id: detect
        run: |
          set -euo pipefail

          echo "Current ref: ${GITHUB_REF_NAME}"
          echo "Event: ${GITHUB_EVENT_NAME}"
          echo "SHA: ${GITHUB_SHA}"

          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] || [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "Manual/tag execution: building all MVP services"
            changed_services="${MVP_SERVICES}"
            deploy_files_changed="true"
          else
            before_sha="${{ github.event.before }}"

            if [ -z "$before_sha" ] || [ "$before_sha" = "0000000000000000000000000000000000000000" ]; then
              base_sha="$(git rev-list --max-parents=0 HEAD)"
            else
              base_sha="$before_sha"
            fi

            echo "Base SHA: $base_sha"
            echo "Head SHA: $GITHUB_SHA"

            changed_files="$(git diff --name-only "$base_sha" "$GITHUB_SHA" || true)"

            echo "Changed files:"
            echo "$changed_files"

            deploy_files_changed="false"

            if echo "$changed_files" | grep -Eq '^(docker-compose\.prod\.yml|docker/|\.github/workflows/)'; then
              deploy_files_changed="true"
            fi

            build_all="false"

            if echo "$changed_files" | grep -Eq '^(pom\.xml|shared/)'; then
              build_all="true"
            fi

            changed_services=""

            if [ "$build_all" = "true" ]; then
              echo "Root pom/shared changed: building all MVP services"
              changed_services="${MVP_SERVICES}"
            else
              for service in $SERVICES; do
                if echo "$changed_files" | grep -Eq "^${service}/"; then
                  changed_services="${changed_services} ${service}"
                fi
              done
            fi

            changed_services="$(echo "$changed_services" | xargs || true)"
          fi

          if [ -n "$changed_services" ]; then
            has_service_changes="true"
          else
            has_service_changes="false"
          fi

          if [ "$has_service_changes" = "true" ] || [ "$deploy_files_changed" = "true" ]; then
            should_deploy="true"
          else
            should_deploy="false"
          fi

          echo "changed_services=${changed_services}" >> "$GITHUB_OUTPUT"
          echo "has_service_changes=${has_service_changes}" >> "$GITHUB_OUTPUT"
          echo "deploy_files_changed=${deploy_files_changed}" >> "$GITHUB_OUTPUT"
          echo "should_deploy=${should_deploy}" >> "$GITHUB_OUTPUT"

          echo "Changed services: ${changed_services}"
          echo "Has service changes: ${has_service_changes}"
          echo "Deploy files changed: ${deploy_files_changed}"
          echo "Should deploy: ${should_deploy}"

  build-and-publish:
    name: Build and publish changed images
    runs-on: ubuntu-latest
    needs: detect-changes

    if: ${{ needs.detect-changes.outputs.has_service_changes == 'true' }}

    outputs:
      image_tag: ${{ steps.tags.outputs.image_tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Validate Maven project
        run: |
          set -euo pipefail
          mvn -B clean verify

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Resolve image tags
        id: tags
        run: |
          set -euo pipefail

          short_sha="${GITHUB_SHA::12}"

          safe_ref="$(printf '%s' "$GITHUB_REF_NAME" \
            | tr '[:upper:]' '[:lower:]' \
            | sed -E 's#[^a-z0-9_.-]+#-#g' \
            | sed -E 's#^-+|-+$##g')"

          if [ "$GITHUB_REF_NAME" = "main" ]; then
            image_tag="latest"
          else
            image_tag="$safe_ref"
          fi

          echo "short_sha=${short_sha}" >> "$GITHUB_OUTPUT"
          echo "safe_ref=${safe_ref}" >> "$GITHUB_OUTPUT"
          echo "image_tag=${image_tag}" >> "$GITHUB_OUTPUT"

          echo "Image tag: ${image_tag}"

      - name: Build and push changed images
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          CHANGED_SERVICES: ${{ needs.detect-changes.outputs.changed_services }}
          SHORT_SHA: ${{ steps.tags.outputs.short_sha }}
          SAFE_REF: ${{ steps.tags.outputs.safe_ref }}
          IMAGE_TAG: ${{ steps.tags.outputs.image_tag }}
        run: |
          set -euo pipefail

          echo "Changed services to build: ${CHANGED_SERVICES}"

          for service in $CHANGED_SERVICES; do
            image="${DOCKERHUB_USERNAME}/${IMAGE_PREFIX}-${service}"

            tags=()
            tags+=(-t "${image}:sha-${SHORT_SHA}")
            tags+=(-t "${image}:${IMAGE_TAG}")

            if [ "$GITHUB_REF_TYPE" = "branch" ] && [ -n "$SAFE_REF" ] && [ "$SAFE_REF" != "$IMAGE_TAG" ]; then
              tags+=(-t "${image}:${SAFE_REF}")
            fi

            if [ "$GITHUB_REF_TYPE" = "tag" ] && [ -n "$SAFE_REF" ]; then
              tags+=(-t "${image}:${SAFE_REF}")
            fi

            echo "=================================================="
            echo "Building image: ${image}"
            echo "Service: ${service}"
            echo "Tags: sha-${SHORT_SHA}, ${IMAGE_TAG}"
            echo "=================================================="

            docker buildx build \
              --platform linux/amd64 \
              --push \
              "${tags[@]}" \
              "./${service}"
          done

  deploy-to-ec2:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs:
      - detect-changes
      - build-and-publish

    if: >-
      ${{
        always() &&
        needs.detect-changes.outputs.should_deploy == 'true' &&
        github.ref_type == 'branch' &&
        github.ref_name == 'main' &&
        (needs.build-and-publish.result == 'success' || needs.build-and-publish.result == 'skipped')
      }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve deployment image tag
        id: deploy
        run: |
          set -euo pipefail

          if [ "$GITHUB_REF_NAME" = "main" ]; then
            echo "image_tag=latest" >> "$GITHUB_OUTPUT"
          else
            safe_tag="$(printf '%s' "$GITHUB_REF_NAME" \
              | tr '[:upper:]' '[:lower:]' \
              | sed -E 's#[^a-z0-9_.-]+#-#g' \
              | sed -E 's#^-+|-+$##g')"

            echo "image_tag=${safe_tag}" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure SSH
        run: |
          set -euo pipefail

          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "${{ secrets.EC2_SSH_KEY }}" > "$HOME/.ssh/orioneta-ec2"
          chmod 600 "$HOME/.ssh/orioneta-ec2"

          ec2_reachable=false

          for attempt in 1 2 3 4 5 6; do
            echo "Testing SSH TCP connection to EC2. Attempt ${attempt}/6"

            if timeout 20 bash -c "</dev/tcp/${{ secrets.EC2_HOST }}/${{ secrets.EC2_PORT }}"; then
              ec2_reachable=true
              break
            fi

            sleep $((attempt * 10))
          done

          if [ "$ec2_reachable" != "true" ]; then
            echo "::error::Could not connect to EC2. Check EC2_HOST, EC2_PORT and Security Group SSH inbound rule."
            exit 1
          fi

          ssh-keyscan -T 20 -p "${{ secrets.EC2_PORT }}" "${{ secrets.EC2_HOST }}" >> "$HOME/.ssh/known_hosts"

      - name: Upload deployment files
        run: |
          set -euo pipefail

          remote="${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}"
          port="${{ secrets.EC2_PORT }}"
          key="$HOME/.ssh/orioneta-ec2"

          ssh -i "$key" -p "$port" -o BatchMode=yes -o ConnectTimeout=20 "$remote" \
            "mkdir -p ~/orioneta-backend/docker/postgres/init"

          scp -i "$key" -P "$port" -o BatchMode=yes -o ConnectTimeout=20 \
            docker-compose.prod.yml \
            "$remote:~/orioneta-backend/docker-compose.prod.yml"

          scp -i "$key" -P "$port" -o BatchMode=yes -o ConnectTimeout=20 \
            docker/postgres/init/01-create-databases.sql \
            "$remote:~/orioneta-backend/docker/postgres/init/01-create-databases.sql"

      - name: Prepare remote environment
        env:
          IMAGE_TAG: ${{ steps.deploy.outputs.image_tag }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          set -euo pipefail

          remote="${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}"
          port="${{ secrets.EC2_PORT }}"
          key="$HOME/.ssh/orioneta-ec2"

          ssh -i "$key" -p "$port" -o BatchMode=yes -o ConnectTimeout=20 "$remote" \
            "DOCKERHUB_USERNAME='$DOCKERHUB_USERNAME' IMAGE_TAG='$IMAGE_TAG' bash -s" <<'REMOTE'
          set -euo pipefail

          mkdir -p ~/orioneta-backend
          cd ~/orioneta-backend

          if [ ! -f .env ]; then
            echo "Creating .env file"

            jwt_secret="$(openssl rand -base64 48)"

            cat > .env <<EOF
          DOCKERHUB_USERNAME=${DOCKERHUB_USERNAME}
          IMAGE_TAG=${IMAGE_TAG}

          POSTGRES_USER=orioneta
          POSTGRES_PASSWORD=orioneta

          RABBITMQ_DEFAULT_USER=orioneta
          RABBITMQ_DEFAULT_PASS=orioneta

          ORIONETA_JWT_ISSUER=orioneta-auth-service
          ORIONETA_JWT_SECRET=${jwt_secret}

          SPRING_PROFILES_ACTIVE=prod
          EOF
          else
            if grep -q '^DOCKERHUB_USERNAME=' .env; then
              sed -i "s#^DOCKERHUB_USERNAME=.*#DOCKERHUB_USERNAME=${DOCKERHUB_USERNAME}#" .env
            else
              printf '\nDOCKERHUB_USERNAME=%s\n' "$DOCKERHUB_USERNAME" >> .env
            fi

            if grep -q '^IMAGE_TAG=' .env; then
              sed -i "s#^IMAGE_TAG=.*#IMAGE_TAG=${IMAGE_TAG}#" .env
            else
              printf 'IMAGE_TAG=%s\n' "$IMAGE_TAG" >> .env
            fi
          fi

          echo "Remote environment ready"
          echo "IMAGE_TAG=${IMAGE_TAG}"
          REMOTE

      - name: Deploy changed services to EC2
        env:
          CHANGED_SERVICES: ${{ needs.detect-changes.outputs.changed_services }}
          DEPLOY_FILES_CHANGED: ${{ needs.detect-changes.outputs.deploy_files_changed }}
        run: |
          set -euo pipefail

          remote="${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}"
          port="${{ secrets.EC2_PORT }}"
          key="$HOME/.ssh/orioneta-ec2"

          ssh -i "$key" -p "$port" \
            -o BatchMode=yes \
            -o ConnectTimeout=20 \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=10 \
            "$remote" \
            "DOCKERHUB_USERNAME='${{ secrets.DOCKERHUB_USERNAME }}' DOCKERHUB_TOKEN='${{ secrets.DOCKERHUB_TOKEN }}' CHANGED_SERVICES='$CHANGED_SERVICES' DEPLOY_FILES_CHANGED='$DEPLOY_FILES_CHANGED' bash -s" <<'REMOTE'
          set -euo pipefail

          echo "=================================================="
          echo "Starting Orioneta deploy"
          echo "=================================================="

          if docker info >/dev/null 2>&1; then
            docker_cmd=(docker)
          elif sudo -n docker info >/dev/null 2>&1; then
            docker_cmd=(sudo -n docker)
          else
            echo "Docker is not available for current user."
            echo "Recommended fix:"
            echo "sudo usermod -aG docker \$USER"
            echo "Then reconnect SSH."
            exit 1
          fi

          cd ~/orioneta-backend

          export COMPOSE_PARALLEL_LIMIT=1
          export DOCKER_CLIENT_TIMEOUT=600
          export COMPOSE_HTTP_TIMEOUT=600

          echo "Memory:"
          free -h || true

          echo "Disk:"
          df -h || true

          echo "Docker:"
          "${docker_cmd[@]}" --version

          echo "Docker Compose:"
          "${docker_cmd[@]}" compose version

          echo "Checking compose config..."
          "${docker_cmd[@]}" compose -f docker-compose.prod.yml config >/dev/null

          echo "Login to DockerHub..."
          printf '%s\n' "$DOCKERHUB_TOKEN" | "${docker_cmd[@]}" login docker.io -u "$DOCKERHUB_USERNAME" --password-stdin
          echo "DockerHub login OK"

          INFRA_SERVICES="postgres rabbitmq"
          MVP_APP_SERVICES="auth-service user-service friendship-service gateway-service"

          if [ -z "${CHANGED_SERVICES}" ]; then
            CHANGED_SERVICES=""
          fi

          retry_pull() {
            service="$1"

            for attempt in 1 2 3 4 5; do
              echo "Pulling ${service}. Attempt ${attempt}/5"

              if "${docker_cmd[@]}" compose -f docker-compose.prod.yml pull "$service"; then
                echo "Pull OK: ${service}"
                return 0
              fi

              if [ "$attempt" -eq 5 ]; then
                echo "Pull failed: ${service}"
                return 1
              fi

              sleep $((attempt * 30))
            done
          }

          get_running_image_id() {
            service="$1"
            container_id="$("${docker_cmd[@]}" compose -f docker-compose.prod.yml ps -q "$service" 2>/dev/null || true)"

            if [ -z "$container_id" ]; then
              echo ""
              return 0
            fi

            "${docker_cmd[@]}" inspect --format='{{.Image}}' "$container_id" 2>/dev/null || true
          }

          get_local_service_image_id() {
            service="$1"
            "${docker_cmd[@]}" compose -f docker-compose.prod.yml images -q "$service" 2>/dev/null | head -n 1 || true
          }

          ensure_infra() {
            for service in $INFRA_SERVICES; do
              echo "Ensuring infra service: ${service}"

              if ! "${docker_cmd[@]}" compose -f docker-compose.prod.yml ps "$service" --status running >/dev/null 2>&1; then
                retry_pull "$service" || true
              fi

              "${docker_cmd[@]}" compose -f docker-compose.prod.yml up -d "$service"
            done
          }

          update_app_service_if_needed() {
            service="$1"

            echo "=================================================="
            echo "Checking service: ${service}"
            echo "=================================================="

            before_image_id="$(get_running_image_id "$service")"

            if [ -n "$before_image_id" ]; then
              echo "Running image ID before pull: ${before_image_id}"
            else
              echo "Service is not running yet: ${service}"
            fi

            retry_pull "$service"

            after_image_id="$(get_local_service_image_id "$service")"

            if [ -n "$after_image_id" ]; then
              echo "Local image ID after pull: ${after_image_id}"
            else
              echo "Could not resolve local image ID for ${service}"
            fi

            if [ "$DEPLOY_FILES_CHANGED" = "true" ]; then
              echo "Deploy files changed. Recreating/checking ${service} with compose."
              "${docker_cmd[@]}" compose -f docker-compose.prod.yml up -d --no-deps "$service"
              return 0
            fi

            if [ -z "$before_image_id" ]; then
              echo "Container does not exist. Starting ${service}."
              "${docker_cmd[@]}" compose -f docker-compose.prod.yml up -d --no-deps "$service"
              return 0
            fi

            if [ "$before_image_id" = "$after_image_id" ]; then
              echo "Image did not change for ${service}. Skipping restart."
              return 0
            fi

            echo "Image changed for ${service}. Restarting container."
            "${docker_cmd[@]}" compose -f docker-compose.prod.yml up -d --no-deps "$service"
          }

          ensure_infra

          if [ -z "$CHANGED_SERVICES" ] && [ "$DEPLOY_FILES_CHANGED" = "true" ]; then
            echo "No app image changed, but deploy files changed."
            echo "Applying compose changes to MVP services."
            CHANGED_SERVICES="$MVP_APP_SERVICES"
          fi

          for service in $CHANGED_SERVICES; do
            case " $MVP_APP_SERVICES " in
              *" $service "*)
                update_app_service_if_needed "$service"
                ;;
              *)
                echo "Skipping ${service} on this EC2 because it is not part of MVP deployment."
                ;;
            esac
          done

          echo "Cleaning unused images..."
          "${docker_cmd[@]}" image prune -f || true

          echo "Final status:"
          "${docker_cmd[@]}" compose -f docker-compose.prod.yml ps

          echo "=================================================="
          echo "Deployment finished"
          echo "=================================================="
          REMOTE

      - name: Print service URL
        run: |
          echo "Gateway URL: http://${{ secrets.EC2_HOST }}:8080"
