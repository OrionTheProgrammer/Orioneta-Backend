name: Build, publish and deploy Orioneta

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      build_scope:
        description: "Servicios a construir"
        required: true
        default: "mvp"
        type: choice
        options:
          - mvp
          - full

permissions:
  contents: read

concurrency:
  group: orioneta-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_PREFIX: orioneta
  JAVA_VERSION: "25"
  SERVICES: >-
    gateway-service bff-service auth-service user-service friendship-service
    conversation-service message-service realtime-service notification-service
    customization-service media-service neta-market-service moderation-service
    audit-service
  MVP_SERVICES: >-
    gateway-service bff-service auth-service user-service friendship-service
    conversation-service message-service realtime-service media-service

jobs:
  detect-changes:
    name: Detectar servicios modificados
    runs-on: ubuntu-latest
    outputs:
      changed_services: ${{ steps.detect.outputs.changed_services }}
      has_service_changes: ${{ steps.detect.outputs.has_service_changes }}
      should_deploy: ${{ steps.detect.outputs.should_deploy }}
    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detectar alcance
        id: detect
        env:
          BUILD_SCOPE: ${{ github.event.inputs.build_scope || 'mvp' }}
        run: |
          set -euo pipefail

          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            if [ "${BUILD_SCOPE}" = "full" ]; then
              changed_services="${SERVICES}"
            else
              changed_services="${MVP_SERVICES}"
            fi
            should_deploy="true"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            changed_services="${SERVICES}"
            should_deploy="false"
          else
            before_sha="${{ github.event.before }}"
            if [ -z "${before_sha}" ] || [ "${before_sha}" = "0000000000000000000000000000000000000000" ]; then
              base_sha="$(git rev-list --max-parents=0 HEAD)"
            else
              base_sha="${before_sha}"
            fi

            changed_files="$(git diff --name-only "${base_sha}" "${GITHUB_SHA}" || true)"
            changed_services=""
            should_deploy="false"

            if printf '%s\n' "${changed_files}" | grep -Eq '^(pom\.xml|shared/|k8s/|deploy/)'; then
              changed_services="${SERVICES}"
            else
              for service in ${SERVICES}; do
                if printf '%s\n' "${changed_files}" | grep -Eq "^${service}/"; then
                  changed_services="${changed_services} ${service}"
                fi
              done
            fi

            if printf '%s\n' "${changed_files}" | grep -Eq '^(pom\.xml|shared/|k8s/|deploy/|[^/]+-service/)'; then
              should_deploy="true"
            fi
          fi

          changed_services="$(printf '%s' "${changed_services}" | xargs || true)"
          if [ -n "${changed_services}" ]; then
            has_service_changes="true"
          else
            has_service_changes="false"
          fi

          {
            echo "changed_services=${changed_services}"
            echo "has_service_changes=${has_service_changes}"
            echo "should_deploy=${should_deploy}"
          } >> "${GITHUB_OUTPUT}"

          echo "Servicios: ${changed_services:-ninguno}"
          echo "Desplegar: ${should_deploy}"

  build-and-publish:
    name: Probar y publicar imagenes
    runs-on: ubuntu-latest
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.has_service_changes == 'true' }}
    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v7

      - name: Configurar Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Ejecutar pruebas
        run: mvn -B clean verify

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Iniciar sesion en Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Resolver etiquetas
        id: tags
        run: |
          set -euo pipefail
          safe_ref="$(printf '%s' "${GITHUB_REF_NAME}" | tr '[:upper:]' '[:lower:]' | sed -E 's#[^a-z0-9_.-]+#-#g; s#^-+|-+$##g')"
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            image_tag="latest"
          else
            image_tag="${safe_ref}"
          fi
          echo "image_tag=${image_tag}" >> "${GITHUB_OUTPUT}"
          echo "short_sha=${GITHUB_SHA::12}" >> "${GITHUB_OUTPUT}"

      - name: Construir y publicar secuencialmente
        env:
          CHANGED_SERVICES: ${{ needs.detect-changes.outputs.changed_services }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          IMAGE_TAG: ${{ steps.tags.outputs.image_tag }}
          SHORT_SHA: ${{ steps.tags.outputs.short_sha }}
        run: |
          set -euo pipefail
          for service in ${CHANGED_SERVICES}; do
            image="${DOCKERHUB_USERNAME}/${IMAGE_PREFIX}-${service}"
            docker buildx build \
              --platform linux/amd64 \
              --push \
              -t "${image}:${IMAGE_TAG}" \
              -t "${image}:sha-${SHORT_SHA}" \
              "./${service}"
          done

  deploy-to-eks:
    name: Desplegar en Amazon EKS
    runs-on: ubuntu-latest
    needs:
      - detect-changes
      - build-and-publish
    if: >-
      ${{
        always() &&
        needs.detect-changes.outputs.should_deploy == 'true' &&
        (github.ref_name == 'main' || github.event_name == 'workflow_dispatch') &&
        (needs.build-and-publish.result == 'success' || needs.build-and-publish.result == 'skipped')
      }}
    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v7

      - name: Configurar credenciales temporales de AWS
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Configurar kubectl
        uses: azure/setup-kubectl@v5

      - name: Conectar con EKS si existe
        id: eks
        run: |
          set -euo pipefail

          cluster_name="${{ secrets.EKS_CLUSTER_NAME }}"

          if [ -z "${cluster_name}" ]; then
            echo "::warning::No se configuro EKS_CLUSTER_NAME. Se omite el despliegue a EKS."
            echo "available=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          if ! aws eks describe-cluster \
            --name "${cluster_name}" \
            --region "${{ secrets.AWS_REGION }}" >/tmp/orioneta-eks-cluster.json 2>/tmp/orioneta-eks-error.log; then
            echo "::warning::El cluster EKS '${cluster_name}' no existe o no esta disponible en esta cuenta/laboratorio. Se omite el despliegue a EKS."
            cat /tmp/orioneta-eks-error.log
            echo "available=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          aws eks update-kubeconfig \
            --name "${cluster_name}" \
            --region "${{ secrets.AWS_REGION }}"
          kubectl auth can-i get deployments --namespace orioneta
          echo "available=true" >> "${GITHUB_OUTPUT}"

      - name: Crear secretos de la aplicacion
        if: ${{ steps.eks.outputs.available == 'true' }}
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          RABBITMQ_PASSWORD: ${{ secrets.RABBITMQ_PASSWORD }}
          MINIO_ROOT_PASSWORD: ${{ secrets.MINIO_ROOT_PASSWORD }}
          ORIONETA_JWT_SECRET: ${{ secrets.ORIONETA_JWT_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GITHUB_CLIENT_ID: ${{ secrets.OAUTH_GITHUB_CLIENT_ID }}
          GITHUB_CLIENT_SECRET: ${{ secrets.OAUTH_GITHUB_CLIENT_SECRET }}
          MAIL_HOST: ${{ secrets.MAIL_HOST }}
          MAIL_PORT: ${{ secrets.MAIL_PORT }}
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_FROM_NAME: ${{ secrets.MAIL_FROM_NAME }}
        run: |
          set -euo pipefail
          for required in POSTGRES_PASSWORD RABBITMQ_PASSWORD MINIO_ROOT_PASSWORD ORIONETA_JWT_SECRET; do
            if [ -z "${!required:-}" ]; then
              echo "::error::Falta configurar el secreto ${required}"
              exit 1
            fi
          done

          kubectl create namespace orioneta --dry-run=client -o yaml | kubectl apply -f -
          kubectl -n orioneta create secret generic orioneta-secrets \
            --from-literal=POSTGRES_USER=orioneta \
            --from-literal=POSTGRES_PASSWORD="${POSTGRES_PASSWORD}" \
            --from-literal=RABBITMQ_DEFAULT_USER=orioneta \
            --from-literal=RABBITMQ_DEFAULT_PASS="${RABBITMQ_PASSWORD}" \
            --from-literal=MINIO_ROOT_USER=orioneta \
            --from-literal=MINIO_ROOT_PASSWORD="${MINIO_ROOT_PASSWORD}" \
            --from-literal=ORIONETA_JWT_ISSUER=orioneta-auth-service \
            --from-literal=ORIONETA_JWT_SECRET="${ORIONETA_JWT_SECRET}" \
            --from-literal=GOOGLE_CLIENT_ID="${GOOGLE_CLIENT_ID:-dev-google-client-id}" \
            --from-literal=GOOGLE_CLIENT_SECRET="${GOOGLE_CLIENT_SECRET:-dev-google-client-secret}" \
            --from-literal=GITHUB_CLIENT_ID="${GITHUB_CLIENT_ID:-dev-github-client-id}" \
            --from-literal=GITHUB_CLIENT_SECRET="${GITHUB_CLIENT_SECRET:-dev-github-client-secret}" \
            --from-literal=MAIL_HOST="${MAIL_HOST:-smtp.gmail.com}" \
            --from-literal=MAIL_PORT="${MAIL_PORT:-587}" \
            --from-literal=MAIL_USERNAME="${MAIL_USERNAME:-dev@orioneta.cl}" \
            --from-literal=MAIL_PASSWORD="${MAIL_PASSWORD:-dev-mail-password}" \
            --from-literal=MAIL_FROM="${MAIL_FROM:-noreply@orioneta.cl}" \
            --from-literal=MAIL_FROM_NAME="${MAIL_FROM_NAME:-Orioneta}" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Aplicar manifiestos y etiqueta de imagen
        if: ${{ steps.eks.outputs.available == 'true' }}
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          BUILD_SCOPE: ${{ github.event.inputs.build_scope || 'full' }}
          KUSTOMIZE_PATH: ${{ secrets.K8S_KUSTOMIZE_PATH || 'k8s' }}
        run: |
          set -euo pipefail

          # El laboratorio usa nodos pequenos. Mantenemos CloudWatch para logs/metricas,
          # pero evitamos la inyeccion automatica de agentes OpenTelemetry en cada pod.
          kubectl delete mutatingwebhookconfiguration \
            amazon-cloudwatch-observability-mutating-webhook-configuration \
            --ignore-not-found=true

          kubectl apply -k "${KUSTOMIZE_PATH}"

          safe_ref="$(printf '%s' "${GITHUB_REF_NAME}" | tr '[:upper:]' '[:lower:]' | sed -E 's#[^a-z0-9_.-]+#-#g; s#^-+|-+$##g')"
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            image_tag="latest"
          else
            image_tag="${safe_ref}"
          fi

          deploy_services="${SERVICES}"
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] && [ "${BUILD_SCOPE}" = "mvp" ]; then
            deploy_services="${MVP_SERVICES}"
          fi

          for service in ${deploy_services}; do
            kubectl -n orioneta set image \
              "deployment/${service}" \
              "${service}=${DOCKERHUB_USERNAME}/${IMAGE_PREFIX}-${service}:${image_tag}"
          done

      - name: Esperar disponibilidad
        if: ${{ steps.eks.outputs.available == 'true' }}
        run: |
          set -euo pipefail
          for service in ${SERVICES}; do
            replicas="$(kubectl -n orioneta get deployment "${service}" -o jsonpath='{.spec.replicas}' 2>/dev/null || echo 0)"
            if [ "${replicas:-0}" = "0" ]; then
              echo "Servicio ${service} escalado a 0 replicas; se omite espera."
              continue
            fi
            kubectl -n orioneta rollout status "deployment/${service}" --timeout=12m
          done
          kubectl -n orioneta get pods
          kubectl -n orioneta get service gateway-service
