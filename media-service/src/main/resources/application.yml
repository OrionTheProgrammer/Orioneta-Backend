server:
  port: 8089

spring:
  application:
    name: media-service

  datasource:
    url: jdbc:postgresql://localhost:5432/orioneta_media
    username: orioneta
    password: orioneta

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,loggers
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

orioneta:
  media:
    storage:
      endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
      access-key: ${MINIO_ACCESS_KEY:orioneta}
      secret-key: ${MINIO_SECRET_KEY:orioneta123}
      bucket: ${MINIO_BUCKET:orioneta-media}
      public-base-url: ${ORIONETA_MEDIA_PUBLIC_BASE_URL:http://localhost:8080}

logging:
  level:
    root: INFO
    org.springframework: WARN
    org.hibernate: WARN
    cl.orioneta: DEBUG
