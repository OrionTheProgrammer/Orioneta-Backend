server:
  port: 8089

spring:
  application:
    name: media-service

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB

  datasource:
    url: jdbc:postgresql://localhost:5432/orioneta_media
    username: orioneta
    password: orioneta

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,loggers
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

logging:
  level:
    root: INFO
    org.springframework: WARN
    org.hibernate: WARN
    cl.orioneta: DEBUG

orioneta:
  media:
    public-content-base-url: ${ORIONETA_MEDIA_PUBLIC_CONTENT_BASE_URL:/api/media}
    minio:
      endpoint: ${ORIONETA_MEDIA_MINIO_ENDPOINT:http://localhost:9000}
      access-key: ${ORIONETA_MEDIA_MINIO_ACCESS_KEY:orioneta}
      secret-key: ${ORIONETA_MEDIA_MINIO_SECRET_KEY:orioneta123}
      bucket: ${ORIONETA_MEDIA_MINIO_BUCKET:orioneta-media}
