spring:
  datasource:
    url: jdbc:h2:mem:orioneta_messages;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    show-sql: false
    defer-datasource-initialization: true
    properties:
      hibernate:
        format_sql: true

  sql:
    init:
      mode: always
      data-locations: classpath:data-dev-h2.sql
      continue-on-error: false

  h2:
    console:
      enabled: true
      path: /h2-console

management:
  health:
    rabbit:
      enabled: false
