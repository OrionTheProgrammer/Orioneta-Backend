spring:
  datasource:
    url: jdbc:h2:mem:orioneta_auth;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    show-sql: false
    defer-datasource-initialization: true
    properties:
      hibernate:
        format_sql: true

  sql:
    init:
      mode: always
      data-locations: classpath:data-dev-h2.sql
      continue-on-error: false

  h2:
    console:
      enabled: true
      path: /h2-console

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

# OAuth2 Configuration para desarrollo local
# ⚠️ ADVERTENCIA: Estas credenciales son solo para desarrollo local.
# En producción, usa variables de entorno o secretos management.
spring:
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:TU_CLIENT_ID_AQUI}
            client-secret: ${GOOGLE_CLIENT_SECRET:TU_CLIENT_SECRET_AQUI}
            scope:
              - openid
              - profile
              - email
            redirect-uri: http://localhost:8082/login/oauth2/code/google
          github:
            client-id: ${GITHUB_CLIENT_ID:TU_CLIENT_ID_AQUI}
            client-secret: ${GITHUB_CLIENT_SECRET:TU_CLIENT_SECRET_AQUI}
            scope:
              - read:user
              - user:email
            redirect-uri: http://localhost:8082/login/oauth2/code/github

orioneta:
  auth:
    oauth2:
      success-redirect-uri: http://localhost:5173/auth/oauth2/callback
      failure-redirect-uri: http://localhost:5173/auth/oauth2/error
