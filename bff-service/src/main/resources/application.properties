spring.application.name=bff-service
server.port=8081

orioneta.services.auth=${ORIONETA_AUTH_URL:http://localhost:8082}
orioneta.services.users=${ORIONETA_USER_URL:http://localhost:8083}
orioneta.services.friendships=${ORIONETA_FRIENDSHIP_URL:http://localhost:8084}
orioneta.services.conversations=${ORIONETA_CONVERSATION_URL:http://localhost:8085}
orioneta.services.messages=${ORIONETA_MESSAGE_URL:http://localhost:8086}
orioneta.services.notifications=${ORIONETA_NOTIFICATION_URL:http://localhost:8087}
orioneta.services.media=${ORIONETA_MEDIA_URL:http://localhost:8089}
orioneta.services.customizations=${ORIONETA_CUSTOMIZATION_URL:http://localhost:8088}
orioneta.services.neta-market=${ORIONETA_NETA_MARKET_URL:http://localhost:8090}

management.endpoints.web.exposure.include=health,info,metrics,prometheus,loggers
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true

logging.level.root=INFO
logging.level.org.springframework=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql=WARN
logging.level.cl.orioneta=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %logger{36} - %msg%n
