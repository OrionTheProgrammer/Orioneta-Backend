spring.application.name=conversation-service
server.port=8085

spring.datasource.url=jdbc:postgresql://localhost:5432/orioneta_conversations
spring.datasource.username=orioneta
spring.datasource.password=orioneta

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=orioneta
spring.rabbitmq.password=orioneta

management.endpoints.web.exposure.include=health,info,metrics,prometheus,loggers
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true

logging.level.root=INFO
logging.level.org.springframework=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql=WARN
logging.level.cl.orioneta=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %logger{36} - %msg%n

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
