services:
  postgres:
    image: postgres:16
    container_name: orioneta-postgres
    environment:
      POSTGRES_USER: orioneta
      POSTGRES_PASSWORD: orioneta
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orioneta -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management
    container_name: orioneta-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: orioneta
      RABBITMQ_DEFAULT_PASS: orioneta
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: orioneta-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: orioneta-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: orioneta
      MINIO_ROOT_PASSWORD: orioneta123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: orioneta-prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:11.3.0
    container_name: orioneta-grafana
    environment:
      GF_SECURITY_ADMIN_USER: orioneta
      GF_SECURITY_ADMIN_PASSWORD: orioneta
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana

  sonarqube:
    image: sonarqube:10.7-community
    container_name: orioneta-sonarqube
    ports:
      - "9000:9000"
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions

volumes:
  postgres_data:
  minio_data:
  grafana_data:
  sonarqube_data:
  sonarqube_extensions:
