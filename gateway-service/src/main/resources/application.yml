server:
  port: 8080

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      mvc:
        routes:
          - id: auth-service
            uri: ${ORIONETA_AUTH_URL:http://localhost:8082}
            predicates:
              - Path=/api/auth/**,/oauth2/**,/login/oauth2/**
          - id: bff-service
            uri: ${ORIONETA_BFF_URL:http://localhost:8081}
            predicates:
              - Path=/api/bff/**
          - id: user-service
            uri: ${ORIONETA_USER_URL:http://localhost:8083}
            predicates:
              - Path=/api/users/**
          - id: friendship-service
            uri: ${ORIONETA_FRIENDSHIP_URL:http://localhost:8084}
            predicates:
              - Path=/api/friendships/**
          - id: conversation-service
            uri: ${ORIONETA_CONVERSATION_URL:http://localhost:8085}
            predicates:
              - Path=/api/conversations/**
          - id: message-service
            uri: ${ORIONETA_MESSAGE_URL:http://localhost:8086}
            predicates:
              - Path=/api/messages/**
          - id: notification-service
            uri: ${ORIONETA_NOTIFICATION_URL:http://localhost:8087}
            predicates:
              - Path=/api/notifications/**
          - id: customization-service
            uri: ${ORIONETA_CUSTOMIZATION_URL:http://localhost:8088}
            predicates:
              - Path=/api/customizations/**
          - id: media-service
            uri: ${ORIONETA_MEDIA_URL:http://localhost:8089}
            predicates:
              - Path=/api/media/**
          - id: neta-market-service
            uri: ${ORIONETA_NETA_MARKET_URL:http://localhost:8090}
            predicates:
              - Path=/api/neta-market/**
          - id: realtime-api
            uri: ${ORIONETA_REALTIME_URL:http://localhost:8091}
            predicates:
              - Path=/api/realtime/**
          - id: moderation-service
            uri: ${ORIONETA_MODERATION_URL:http://localhost:8092}
            predicates:
              - Path=/api/moderation/**
          - id: audit-service
            uri: ${ORIONETA_AUDIT_URL:http://localhost:8093}
            predicates:
              - Path=/api/audit/**

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,loggers
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

logging:
  level:
    root: INFO
    org.springframework: WARN
    cl.orioneta: DEBUG
