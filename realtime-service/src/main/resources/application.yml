server:
  port: 8091

spring:
  application:
    name: realtime-service

  rabbitmq:
    host: localhost
    port: 5672
    username: orioneta
    password: orioneta

  data:
    redis:
      host: localhost
      port: 6379
      lettuce:
        pool:
          enabled: true
          max-active: 16
          max-idle: 8
          min-idle: 4
          max-wait: -1ms
          time-between-eviction-runs: 30000ms

orioneta:
  services:
    conversations: ${ORIONETA_CONVERSATION_URL:http://localhost:8085}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,loggers
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

logging:
  level:
    root: INFO
    org.springframework: WARN
    cl.orioneta: DEBUG
