apiVersion: v1
kind: ConfigMap
metadata:
  name: orioneta-config
  labels:
    app.kubernetes.io/name: orioneta-config
    app.kubernetes.io/part-of: orioneta
data:
  SPRING_PROFILES_ACTIVE: "prod"
  JAVA_TOOL_OPTIONS: "-Xms64m -Xmx256m"
  SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "3"
  SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: "0"
  SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT: "30000"

  ORIONETA_AUTH_URL: "http://auth-service:8082"
  ORIONETA_BFF_URL: "http://bff-service:8081"
  ORIONETA_USER_URL: "http://user-service:8083"
  ORIONETA_FRIENDSHIP_URL: "http://friendship-service:8084"
  ORIONETA_CONVERSATION_URL: "http://conversation-service:8085"
  ORIONETA_MESSAGE_URL: "http://message-service:8086"
  ORIONETA_NOTIFICATION_URL: "http://notification-service:8087"
  ORIONETA_CUSTOMIZATION_URL: "http://customization-service:8088"
  ORIONETA_MEDIA_URL: "http://media-service:8089"
  ORIONETA_NETA_MARKET_URL: "http://neta-market-service:8090"
  ORIONETA_REALTIME_URL: "http://realtime-service:8091"
  ORIONETA_MODERATION_URL: "http://moderation-service:8092"
  ORIONETA_AUDIT_URL: "http://audit-service:8093"

  ORIONETA_SERVICES_USERS: "http://user-service:8083"
  ORIONETA_MEDIA_PUBLIC_BASE_URL: "https://orioneta.accesscam.org"
  ORIONETA_PUBLIC_BASE_URL: "https://orioneta.accesscam.org"
  ORIONETA_CORS_ALLOWED_ORIGINS: "http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174,http://localhost:3000,http://orioneta.accesscam.org,https://orioneta.accesscam.org,http://3.82.134.149"
  ORIONETA_OAUTH2_SUCCESS_REDIRECT_URI: "https://orioneta.accesscam.org/auth/oauth2/callback"
  ORIONETA_OAUTH2_FAILURE_REDIRECT_URI: "https://orioneta.accesscam.org/auth/oauth2/error"

  MINIO_ENDPOINT: "http://minio:9000"
  MINIO_BUCKET: "orioneta-media"
